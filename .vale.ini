# Prose gate for turnstile's own docs. Deterministic, free and fast, which is
# why it belongs on the same floor as `bash -n` rather than in an ai module.
#
#   vale sync              fetch the pinned style package into .vale/styles
#   vale README.md         lint one file
#   turnstile run          lint what the push would carry, via the `prose` check
#
# The style package is pinned. Upgrading it means re-running the generator
# below, because a rule added by a new release arrives at `error` and gates
# until it is listed.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.29.0/ai-tells.zip

# ------------------------------------------------------- everything with prose
#
# Two ai-tells rules gate; the other 76 print as suggestions. Vale silently
# ignores a wildcard override - `ai-tells.* = suggestion` produces no error, no
# warning and no effect - so every demotion is listed. Regenerate with:
#
#   ls .vale/styles/ai-tells/*.yml | xargs -n1 basename | sed 's/\.yml$//' \
#     | grep -vxE 'EmDashUsage|DoubleHyphen' \
#     | sed 's/^/ai-tells./;s/$/ = suggestion/'

[*.{md,py}]
BasedOnStyles = ai-tells, Turnstile
Turnstile.PromptContract = NO

# The house rule, from AGENTS.md.
ai-tells.EmDashUsage = error
ai-tells.DoubleHyphen = error

ai-tells.AbsoluteAssertions = suggestion
ai-tells.AffirmativeFormulas = suggestion
ai-tells.AIAdjectiveNounPairs = suggestion
ai-tells.AICompoundPhrases = suggestion
