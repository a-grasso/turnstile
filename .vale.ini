# ----------------------------------------------------------------- prose docs
#
# Vale's built-in style is a spellchecker with no idea what this repo is about:
# 57 alerts over 29 unique terms on these files, every one of them vocabulary
# (`hooksPath`, `pre-push`, `turnstile`, `frontmatter`) rather than a typo, and
# an accept list that would grow with every page. Repetition ("the the") is the
# part that costs nothing.

[*.md]
BasedOnStyles = ai-tells, Turnstile, Vale
Vale.Spelling = NO
Vale.Terms = NO

# -------------------------------------------------------------- module prompts
#
# `modules/*.md` are system prompts, not documentation. The em-dash rule still
# applies, because a prompt written in em dashes teaches the model to answer in
# them. The rest is about human writing and has no business grading an
# instruction to a model - and a prompt telling the model what not to overclaim
# is not itself an overclaim.
#
# PromptContract is the one rule that only makes sense here. `eval/probes` calls
# the "do not report" guidance the thing that separates a tuned prompt from a
# credulous one, and the corpus cannot tell the two apart. This will not judge
# the guidance, but it does notice when a refactor leaves none of it behind. The
# ablated copy under `eval/probes` is a control and is deliberately out of glob.

[modules/*.md]
Turnstile.Overclaim = NO
Turnstile.PromptContract = error

# --------------------------------------------------------------- code comments
#
# Vale scopes .py to comments and docstrings, so the prose gets linted and the
# code does not. There is no shell parser, so `bin/turnstile` and
# `hooks/dispatch` stay out of scope - vale reads them as plain text and grades
# every string literal. `bin/turnstile-ai` is Python but extensionless, so vale
# cannot infer the format and it is out of scope for the same reason.
#
# DoubleHyphen goes off here: vale does not parse markdown inside a comment, so
# a documented flag such as --strict reads as prose punctuation.

[*.py]
ai-tells.DoubleHyphen = NO
